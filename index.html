        const InputCell = ({ id, value, onChange, onFocus, activeId, label, isTextArea = false, isChecked, correctValue }) => {
          const isActive = activeId === id;
          const val = value || '';
          
          const normalize = (str) => str ? str.toString().replace(/\s+/g, '').toLowerCase() : '';
          const isCorrect = isChecked && normalize(val) === normalize(correctValue);
          const isWrong = isChecked && !isCorrect;

          let borderStyle = 'border-gray-300 hover:border-blue-400';
          let bgStyle = 'bg-white';
          let ringStyle = '';

          if (isActive) {
            borderStyle = 'border-blue-500';
            bgStyle = 'bg-blue-50';
            ringStyle = 'ring-2 ring-blue-200 shadow-inner z-10';
          } else if (isChecked) {
            if (isCorrect) {
              borderStyle = 'border-green-500';
              bgStyle = 'bg-green-50';
            } else {
              borderStyle = 'border-red-500';
              bgStyle = 'bg-red-50';
            }
          }

          return (
            <div className="relative flex flex-col h-full w-full">
              {label && <span className="text-[10px] text-gray-500 font-bold select-none mb-0.5 block">{label}</span>}
              <div className="relative flex-grow">
                {isTextArea ? (
                  <textarea
                    id={id}
                    className={`w-full h-full border text-sm px-1 transition-all duration-200 focus:outline-none font-sans resize-none py-1 ${borderStyle} ${bgStyle} ${ringStyle}`}
                    value={val}
                    onChange={(e) => onChange(id, e.target.value)}
                    onClick={(e) => { e.stopPropagation(); onFocus(id); }}
                    placeholder=""
                  />
                ) : (
                  <input
                    id={id}
                    type="text"
                    className={`w-full h-full border text-sm px-1 transition-all duration-200 focus:outline-none font-sans ${borderStyle} ${bgStyle} ${ringStyle}`}
                    value={val}
                    onChange={(e) => onChange(id, e.target.value)}
                    onClick={(e) => { e.stopPropagation(); onFocus(id); }}
                    autoComplete="off"
                  />
                )}
              </div>
              {isWrong && (
                <div className="absolute top-full left-0 bg-red-100 text-red-700 text-[10px] p-1 border border-red-300 rounded shadow-lg z-20 w-full break-words">
                  <strong>正确:</strong> {correctValue || '(空)'}
                </div>
              )}
            </div>
          );
        };

                            <div className="border-r border-black p-1"><InputCell id="freight" label="Freight & Charges" isTextArea className="border-none" value={formData.bl.freight} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.bl.freight} /></div>
                            <div className="grid grid-rows-2">
                               <div className="border-b border-black p-1"><InputCell id="placeDate" label="Place and Date of Issue" value={formData.bl.placeDate} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.bl.placeDate} /></div>
                               <div className="p-1"><InputCell id="signed" label="Signed by" value={formData.bl.signed} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.bl.signed} /></div>
                            </div>
                         </div>
                      </div>
                    )}

                    {/* Insurance Form */}
                    {activeTab === 'insurance' && (
                       <div className="flex flex-col font-serif">
                          <div className="text-center mb-6">
                             <h2 className="text-xl font-bold">THE PEOPLE'S INSURANCE COMPANY OF CHINA</h2>
                             <h1 className="text-4xl font-bold my-2">INSURANCE POLICY</h1>
                          </div>
                          <div className="flex justify-between px-4 mb-4 gap-8">
                             <div className="flex-1 space-y-2">
                                <div className="flex gap-2">Invoice No.: <InputCell id="invNo" value={formData.insurance.invNo} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.invNo} /></div>
                                <div className="flex gap-2">Policy No.: <InputCell id="polNo" value={formData.insurance.polNo} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.polNo} /></div>
                             </div>
                             <div className="italic pt-8">The First Original</div>
                          </div>
                          <div className="px-4 mb-2 space-y-2">
                             <div className="flex gap-2 items-center">
                                <span>Insured:</span>
                                <div className="flex-1 h-8"><InputCell id="insured" value={formData.insurance.insured} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.insured} /></div>
                             </div>
                             <p className="text-xs text-justify">undertakes to insure the undermentioned goods...</p>
                          </div>
                          <div className="border border-black mx-4 flex flex-1 min-h-[150px]">
                             <div className="w-[18%] border-r border-black p-1"><InputCell id="marks" label="Marks" isTextArea className="border-none" value={formData.insurance.marks} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.marks} /></div>
                             <div className="w-[12%] border-r border-black p-1"><InputCell id="qty" label="Quantity" isTextArea className="border-none" value={formData.insurance.qty} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.qty} /></div>
                             <div className="w-[50%] border-r border-black p-1"><InputCell id="desc" label="Description" isTextArea className="border-none" value={formData.insurance.desc} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.desc} /></div>
                             <div className="w-[20%] p-1"><InputCell id="amount" label="Amount" isTextArea className="border-none" value={formData.insurance.amount} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.amount} /></div>
                          </div>
                          <div className="mx-4 mt-2 flex gap-2">
                             <span className="font-bold">Total Amount:</span>
                             <InputCell id="total" value={formData.insurance.total} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.total} />
                          </div>
                          <div className="mx-4 mt-4 grid grid-cols-2 gap-4">
                             <div className="flex gap-2">Per Conveyance: <InputCell id="vessel" value={formData.insurance.vessel} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.vessel} /></div>
                             <div className="flex gap-2">Slg. on or abt: <InputCell id="slg" value={formData.insurance.slg} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.slg} /></div>
                             <div className="flex gap-2">From: <InputCell id="from" value={formData.insurance.from} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.from} /></div>
                             <div className="flex gap-2">To: <InputCell id="to" value={formData.insurance.to} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.to} /></div>
                          </div>
                          <div className="mx-4 mt-4 flex h-20 gap-2">
                             <span className="font-bold">Conditions:</span>
                             <InputCell id="conditions" isTextArea value={formData.insurance.conditions} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.conditions} />
                          </div>
                          <div className="mx-4 mt-4 grid grid-cols-2 gap-4">
                             <div className="flex gap-2">Payable at: <InputCell id="payable" value={formData.insurance.payable} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.payable} /></div>
                             <div className="flex gap-2">Date: <InputCell id="date" value={formData.insurance.date} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.date} /></div>
                          </div>
                       </div>
                    )}

                    {/* Draft Form */}
                    {activeTab === 'draft' && (
                      <div className="border border-black p-6 relative">
                         <div className="absolute top-0 left-0 bg-black text-white px-2 py-1 text-xs">BILL OF EXCHANGE</div>
                         <div className="flex justify-between mt-8 mb-8 gap-4">
                            <div className="w-1/3"><InputCell id="no" label="No." value={formData.draft.no} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.no} /></div>
                            <div className="w-1/3"><InputCell id="place" label="Place & Date" value={formData.draft.place} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.place} /></div>
                            <div className="w-1/3 border-2 border-dashed border-gray-300"><InputCell id="amountNum" label="Amount (Figures)" value={formData.draft.amountNum} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.amountNum} /></div>
                         </div>
                         <div className="space-y-6 text-lg">
                            <div className="flex items-end gap-2">
                               <span>At</span>
                               <div className="w-48"><InputCell id="tenor" value={formData.draft.tenor} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.tenor} /></div>
                               <span>Sight of this First of Exchange</span>
                            </div>
                            <div className="flex items-end gap-2">
                               <span>Pay to the order of</span>
                               <div className="flex-1"><InputCell id="payee" value={formData.draft.payee} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.payee} /></div>
                            </div>
                            <div className="flex items-end gap-2">
                               <span>the sum of</span>
                               <div className="flex-1"><InputCell id="amountWords" value={formData.draft.amountWords} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.amountWords} /></div>
                            </div>
                         </div>
                         <div className="flex mt-12 gap-8">
                            <div className="w-1/2 space-y-2 text-sm">
                               <div className="flex gap-2">Drawn under: <InputCell id="bank" value={formData.draft.bank} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.bank} /></div>
                               <div className="flex gap-2">L/C No.: <InputCell id="lc" value={formData.draft.lc} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.lc} /></div>
                               <div className="flex gap-2">Dated: <InputCell id="lcDate" value={formData.draft.lcDate} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.lcDate} /></div>
                               <div className="mt-4 pt-2 border-t border-black">
                                  <div className="mb-1">To:</div>
                                  <div className="h-16"><InputCell id="drawee" isTextArea value={formData.draft.drawee} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft.drawee} /></div>
                               </div>
                            </div>
                            <div className="w-1/2 flex flex-col justify-end">
                               <div className="border-b border-black mb-1 w-full"></div>
                               <div className="text-right text-xs">(Signature)</div>
                            </div>
                         </div>
                      </div>
                    )}

                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
