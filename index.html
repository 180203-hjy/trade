            className += "bg-blue-600 text-white border border-blue-800 scale-105 shadow-md z-10";

          } else {
            className += "bg-transparent text-gray-800 border-b border-gray-400 border-dashed hover:bg-yellow-50 hover:border-blue-500 hover:text-blue-700";
          }
          return (
            <span
              onClick={(e) => { e.stopPropagation(); onSelect(text, id); }}
              className={className}
              title={isUsed ? "已使用" : "点击选中"}
            >

        // 4. 右侧表单单元格
        // ==========================================
        const InputCell = ({ id, value, onChange, onFocus, activeId, label, isTextArea = false, isChecked, correctValue }) => {
          const isActive = activeId === id;
          const val = value || '';
          const normalize = (str) => str ? str.toString().replace(/[\s,.]+/g, '').toLowerCase() : '';
          
          let isCorrect = true;
          if (isChecked) {
             if (id === 'no' && correctValue === '335673') {
                // Draft 1特殊处理，两个号码都算对
                const v = normalize(val);
                isCorrect = (v === '335673' || v === '3356719');
             } else {
                isCorrect = normalize(val) === normalize(correctValue);
             }
          }
          const isWrong = isChecked && !isCorrect;

          let borderStyle = 'border-gray-400 hover:border-blue-300';
          let bgStyle = 'bg-transparent';
          let ringStyle = '';

          if (isActive) {
            borderStyle = 'border-yellow-500';
            bgStyle = 'bg-yellow-200';
            ringStyle = 'ring-2 ring-yellow-300 shadow-inner z-10';
          } else if (isChecked) {
            borderStyle = isCorrect ? 'border-green-500' : 'border-red-500';
            bgStyle = isCorrect ? 'bg-green-50' : 'bg-red-50';
          }

          return (
            <div className="relative flex flex-col h-full w-full group">
              {label && <span className="text-[10px] text-gray-500 font-bold select-none mb-0.5 block">{label}</span>}
              <div className="relative flex-grow">
                {isTextArea ? (
                  <textarea
                    id={id}
                    className={`w-full h-full border text-sm px-1 transition-all duration-200 focus:outline-none font-typewriter resize-none py-1 ${borderStyle} ${bgStyle} ${ringStyle}`}
                    value={val}
                    onChange={(e) => onChange(id, e.target.value)}
                    onClick={(e) => { e.stopPropagation(); onFocus(id); }}
                  />
                ) : (
                  <input
                    id={id}
                    type="text"
                    className={`w-full h-full border text-sm px-1 transition-all duration-200 focus:outline-none font-typewriter ${borderStyle} ${bgStyle} ${ringStyle}`}
                    value={val}
                    onChange={(e) => onChange(id, e.target.value)}
                    onClick={(e) => { e.stopPropagation(); onFocus(id); }}
                    autoComplete="off"
                  />
                )}
              </div>
              {isWrong && (
                <div className="tooltip-enter hidden group-hover:block absolute top-full left-0 mt-1 bg-red-100 text-red-700 text-[10px] p-2 border border-red-300 rounded shadow-lg z-50 w-full break-words min-w-[100px]">
                  <strong>正确答案:</strong> {correctValue || '(空)'}
                </div>
              )}
            </div>
          );
        };

                               <div className="border-b border-black p-1"><InputCell id="placeDate" label="Place and Date of Issue" value={formData.bl.placeDate} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.bl.placeDate} /></div>
                               <div className="border-b border-black p-1"><InputCell id="onBoardDate" label="Shipped on Board Date" value={formData.bl.onBoardDate} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.bl.onBoardDate} /></div>
                               <div className="flex">
                                  <div className="w-2/3 p-1 border-r border-black"><InputCell id="signed" label="Signed by" value={formData.bl.signed} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.bl.signed} /></div>
                                  <div className="w-1/3 p-1"><InputCell id="originals" label="No. of Originals" value={formData.bl.originals} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.bl.originals} /></div>
                               </div>
                            </div>
                         </div>
                      </div>
                    )}

                    {/* Insurance Form */}
                    {activeTab === 'insurance' && (
                       <div className="flex flex-col h-full font-serif text-sm">
                          <div className="text-center mb-6">
                             <h2 className="text-xl font-bold">THE PEOPLE'S INSURANCE COMPANY OF CHINA</h2>
                             <h1 className="text-4xl font-bold my-2">INSURANCE POLICY</h1>
                          </div>
                          <div className="flex justify-between px-4 mb-4 gap-8">
                             <div className="flex-1 space-y-2">
                                <div className="flex gap-2">Invoice No.: <InputCell id="invNo" value={formData.insurance.invNo} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.invNo} /></div>
                                <div className="flex gap-2">Policy No.: <InputCell id="polNo" value={formData.insurance.polNo} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.polNo} /></div>
                             </div>
                             <div className="italic pt-8">The First Original</div>
                          </div>
                          <div className="px-4 mb-2 space-y-2">
                             <div className="flex gap-2 items-center">
                                <span>Insured:</span>
                                <div className="flex-1 h-8"><InputCell id="insured" value={formData.insurance.insured} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.insured} /></div>
                             </div>
                             <p className="text-xs text-justify">undertakes to insure the undermentioned goods...</p>
                          </div>
                          <div className="border border-black mx-4 min-h-[150px] flex">
                             <div className="w-[20%] border-r border-black p-1"><InputCell id="marks" label="Marks" isTextArea className="border-none" value={formData.insurance.marks} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.marks} /></div>
                             <div className="w-[15%] border-r border-black p-1"><InputCell id="qty" label="Quantity" isTextArea className="border-none" value={formData.insurance.qty} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.qty} /></div>
                             <div className="w-[45%] border-r border-black p-1"><InputCell id="desc" label="Description" isTextArea className="border-none" value={formData.insurance.desc} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.desc} /></div>
                             <div className="w-[20%] p-1"><InputCell id="amount" label="Amount" isTextArea className="border-none" value={formData.insurance.amount} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.amount} /></div>
                          </div>
                          <div className="mx-4 mt-2 flex gap-2">
                             <span className="font-bold">Total Amount:</span>
                             <InputCell id="total" value={formData.insurance.total} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.total} />
                          </div>
                          <div className="mx-4 mt-2 flex gap-4">
                             <div className="flex-1 flex gap-2">Premium: <InputCell id="premium" value={formData.insurance.premium} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.premium} /></div>
                             <div className="flex-1 flex gap-2">Rate: <InputCell id="rate" value={formData.insurance.rate} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.rate} /></div>
                          </div>
                          <div className="mx-4 mt-4 grid grid-cols-2 gap-4">
                             <div className="flex gap-2">Per Conveyance: <InputCell id="vessel" value={formData.insurance.vessel} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.vessel} /></div>
                             <div className="flex gap-2">Slg. on or abt: <InputCell id="slg" value={formData.insurance.slg} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.slg} /></div>
                             <div className="flex gap-2">From: <InputCell id="from" value={formData.insurance.from} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.from} /></div>
                             <div className="flex gap-2">To: <InputCell id="to" value={formData.insurance.to} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.to} /></div>
                          </div>
                          <div className="mx-4 mt-4 flex h-20 gap-2">
                             <span className="font-bold">Conditions:</span>
                             <InputCell id="conditions" isTextArea value={formData.insurance.conditions} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.conditions} />
                          </div>
                          
                          <div className="mx-4 mt-4 text-xs text-justify">
                            Claims if any payable on surrender of the first original of the Policy together with other relevant documents In the event of accident whereby loss or damage may result in a claim under this Policy immediate notice applying for survey must be given to the Company's Agent as mentioned hereunder:
                          </div>

                          <div className="mx-4 mt-2 flex gap-2">
                              <span className="font-bold whitespace-nowrap">Survey/Claim Agent:</span>
                              <InputCell id="agent" value={formData.insurance.agent} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.agent} />
                          </div>
                          <div className="mx-4 mt-4 grid grid-cols-2 gap-4">
                             <div className="flex gap-2">Payable at: <InputCell id="payable" value={formData.insurance.payable} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.payable} /></div>
                             <div className="flex gap-2">Date: <InputCell id="date" value={formData.insurance.date} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.date} /></div>
                          </div>
                          <div className="mx-4 mt-4 text-right">
                              <div className="inline-block w-64 border-t border-black text-center pt-1">
                                  <div className="h-8"><InputCell id="signature" label="Authorized Signature" value={formData.insurance.signature} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.insurance.signature} /></div>
                              </div>
                          </div>
                       </div>
                    )}

                    {activeTab === 'draft' && (
                      <div className="border border-black p-6 h-full relative">
                         {draftMode === 'draft1' ? (
                            // Draft 1 Form
                            <>
                                <div className="absolute top-0 left-0 bg-black text-white px-2 py-1 text-xs">BILL OF EXCHANGE (练习 1)</div>
                                <div className="flex justify-between mt-8 mb-8 gap-4">
                                    <div className="w-1/3"><InputCell id="no" label="No." value={formData.draft1.no} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.no} /></div>
                                    <div className="w-1/3"><InputCell id="place" label="Place & Date" value={formData.draft1.place} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.place} /></div>
                                    <div className="w-1/3 border-2 border-dashed border-gray-300"><InputCell id="amountNum" label="Exchange for" value={formData.draft1.amountNum} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.amountNum} /></div>
                                </div>
                                <div className="space-y-6 text-lg">
                                    <div className="flex items-end gap-2">
                                        <span>At</span>
                                        <div className="w-48"><InputCell id="tenor" value={formData.draft1.tenor} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.tenor} /></div>

                                    </div>
                                    <div className="flex items-end gap-2">
                                        <span>Payable with interest @</span>
                                        <div className="w-16 border-b border-black"><InputCell id="interest" className="border-none text-center" value={formData.draft1.interest} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.interest} /></div>
                                        <span>% per annum</span>
                                    </div>
                                    <div className="flex items-end gap-2">
                                        <span>Pay to the order of</span>
                                        <div className="flex-1"><InputCell id="payee" value={formData.draft1.payee} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.payee} /></div>
                                    </div>
                                    <div className="flex items-end gap-2">
                                        <span>the sum of</span>
                                        <div className="flex-1"><InputCell id="amountWords" value={formData.draft1.amountWords} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.amountWords} /></div>
                                    </div>
                                </div>
                                <div className="flex mt-12 gap-8">
                                    <div className="w-1/2 space-y-2 text-sm">
                                        <div className="flex gap-2">Drawn under: <InputCell id="bank" value={formData.draft1.bank} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.bank} /></div>
                                        <div className="flex gap-2">L/C No.: <InputCell id="lc" value={formData.draft1.lc} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.lc} /></div>
                                        <div className="flex gap-2">Dated: <InputCell id="lcDate" value={formData.draft1.lcDate} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.lcDate} /></div>
                                        <div className="mt-4 pt-2 border-t border-black">
                                            <div className="mb-1">To:</div>
                                            <div className="h-16"><InputCell id="drawee" isTextArea value={formData.draft1.drawee} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.drawee} /></div>
                                        </div>
                                    </div>
                                    <div className="w-1/2 flex flex-col justify-end items-end">
                                        <div className="w-full h-20 border-b border-black mb-1">
                                           <InputCell id="drawer" label="Drawer" isTextArea className="border-none text-right flex items-end justify-end pb-0" value={formData.draft1.drawer} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft1.drawer} />
                                        </div>
                                        <div className="text-right text-xs">(Signature)</div>
                                    </div>
                                </div>
                            </>
                         ) : (
                            // Draft 2 Form
                            <>
                                <div className="absolute top-0 left-0 bg-blue-800 text-white px-2 py-1 text-xs">BILL OF EXCHANGE (练习 2)</div>
                                <div className="flex justify-between mt-8 mb-8 gap-4">
                                    <div className="w-1/3"><InputCell id="no" label="No." value={formData.draft2.no} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.no} /></div>
                                    <div className="w-1/3"><InputCell id="place" label="Place & Date" value={formData.draft2.place} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.place} /></div>
                                    <div className="w-1/3 border-2 border-dashed border-gray-300"><InputCell id="amountNum" label="Exchange for" value={formData.draft2.amountNum} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.amountNum} /></div>
                                </div>
                                <div className="space-y-6 text-lg">
                                    <div className="flex items-end gap-2">
                                        <span>At</span>
                                        <div className="w-48"><InputCell id="tenor" value={formData.draft2.tenor} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.tenor} /></div>
                                        <span className="text-sm">Sight of this Second of Exchange (First of the same tenor and date being unpaid)</span>
                                    </div>
                                    <div className="flex items-end gap-2">
                                        <span>Payable with interest @</span>
                                        <div className="w-16 border-b border-black"><InputCell id="interest" className="border-none text-center" value={formData.draft2.interest} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.interest} /></div>
                                        <span>% per annum</span>
                                    </div>
                                    <div className="flex items-end gap-2">
                                        <span>Pay to the order of</span>
                                        <div className="flex-1"><InputCell id="payee" value={formData.draft2.payee} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.payee} /></div>
                                    </div>
                                    <div className="flex items-end gap-2">
                                        <span>the sum of</span>
                                        <div className="flex-1"><InputCell id="amountWords" value={formData.draft2.amountWords} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.amountWords} /></div>
                                    </div>
                                </div>
                                <div className="flex mt-12 gap-8">
                                    <div className="w-1/2 space-y-2 text-sm">
                                        <div className="flex gap-2">Drawn under: <InputCell id="bank" value={formData.draft2.bank} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.bank} /></div>
                                        <div className="flex gap-2">L/C No.: <InputCell id="lc" value={formData.draft2.lc} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.lc} /></div>
                                        <div className="flex gap-2">Dated: <InputCell id="lcDate" value={formData.draft2.lcDate} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.lcDate} /></div>
                                        <div className="mt-4 pt-2 border-t border-black">
                                            <div className="mb-1">To:</div>
                                            <div className="h-16"><InputCell id="drawee" isTextArea value={formData.draft2.drawee} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.drawee} /></div>
                                        </div>
                                    </div>
                                    <div className="w-1/2 flex flex-col justify-end items-end">
                                        <div className="w-full h-20 border-b border-black mb-1">
                                           <InputCell id="drawer" label="Drawer" isTextArea className="border-none text-right flex items-end justify-end pb-0" value={formData.draft2.drawer} onChange={handleFieldChange} onFocus={handleFieldClick} isChecked={isChecked} correctValue={CORRECT_ANSWERS.draft2.drawer} />
                                        </div>
                                        <div className="text-right text-xs">(Signature)</div>
                                    </div>
                                </div>
                            </>
                         )}
                      </div>
                    )}

                  </div>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
